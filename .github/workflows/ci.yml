name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Check formatting of changed source files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.css' \
            | xargs -0 -r ./node_modules/.bin/oxfmt --check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cape-town-12-day-pdf-guides
          path: dist/guides/*.pdf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/
