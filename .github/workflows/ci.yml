name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Export Oxfmt-corrected source for PR repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/use-original-pdf-downloads'
        run: |
          for file in e2e/offline.spec.ts scripts/verify-guides.ts src/guides.ts src/main.tsx vite.config.ts; do
            ./node_modules/.bin/oxfmt "$file"
            echo "FORMAT_SNAPSHOT_START:$file"
            base64 -w 0 "$file" | fold -w 2048
            echo "FORMAT_SNAPSHOT_END:$file"
          done
      - run: npm run guides:verify
      - run: npm run lint
      - name: Check formatting of changed source files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.css' \
            | xargs -0 -r ./node_modules/.bin/oxfmt --check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cape-town-original-10-day-pdf-guides
          path: dist/guides/*.pdf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/
