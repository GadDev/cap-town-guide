name: Synchronize PR 6 lockfile (temporary)
on:
  push:
    branches: [fix/use-original-pdf-downloads]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(lock): remove PDFKit dependencies from original-guides branch"
            git push
          fi
