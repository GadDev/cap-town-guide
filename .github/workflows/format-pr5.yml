name: Format and lock PR 5
on:
  push:
    branches: [feat/leaflet-interactive-openstreetmap]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install map dependencies and update package lock
        run: npm install --no-audit --no-fund
      - name: Format PR-specific files
        run: npx oxfmt src/main.tsx src/InteractiveMap.tsx src/mapData.ts src/map.css tests/map.test.ts e2e/offline.spec.ts
      - name: Commit lockfile and source formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json src/main.tsx src/InteractiveMap.tsx src/mapData.ts src/map.css tests/map.test.ts e2e/offline.spec.ts
            git commit -m "chore: lock Leaflet dependencies and format interactive map"
            git push
          fi
